<rect width="2200" height="1440" fill="#f8fafc"/>
<text x="60" y="62" class="title">TokTik — Provider, Repository y múltiples DataSources de video</text>
<text x="60" y="92" class="sub">Carga de metadatos → entidad común VideoPost → secciones del feed → reproductor elegido según la fuente</text>


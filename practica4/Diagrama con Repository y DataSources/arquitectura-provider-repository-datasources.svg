<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1440" viewBox="0 0 2200 1440" role="img" aria-labelledby="title desc">
<title id="title">TokTik — Arquitectura de Provider, Repository y múltiples DataSources de video</title>
<desc id="desc">Vista de capas del flujo de carga de videos en TokTik desde la interfaz hasta cuatro fuentes registradas, el repositorio de resultados comunes y los reproductores.</desc>

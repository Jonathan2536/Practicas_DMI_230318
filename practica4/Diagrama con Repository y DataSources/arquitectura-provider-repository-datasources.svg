<!-- footer notes -->
<rect x="45" y="1090" width="2110" height="295" rx="16" fill="#fff" stroke="#d5dfe8" stroke-width="1.5"/>
<text x="72" y="1130" class="h">Procesamiento de resultados y avisos de configuración</text>
<text x="72" y="1165" class="body">Repository: Future.wait de DataSources → intercalado por índice → deduplicación por ID (se conserva la primera aparición) → Provider.</text>
<text x="72" y="1193" class="body">Fallo parcial: guarda diagnostic y conserva éxitos. Si todos fallan y no hay videos, lanza VideoDataSourcesException; el reintento es una nueva llamada desde UI.</text>
<text x="72" y="1221" class="body">Credenciales requeridas: YOUTUBE_API_KEY + YOUTUBE_PLAYLIST_ID; PIXABAY_API_KEY. VIMEO_VIDEO_URLS es opcional; no aparece en las variables configuradas observadas.</text>
<text x="72" y="1249" class="body">InstagramVideoDataSource existe pero no está registrado: es un placeholder que lanza UnconfiguredVideoDataSourceException y no hace solicitudes.</text>
<text x="72" y="1277" class="body">Nota: “Local” describe el origen de los metadatos; los archivos de video se sirven desde URLs remotas de Google Drive, no desde almacenamiento local del dispositivo.</text>
<line x1="75" y1="1333" x2="135" y2="1333" class="call"/><text x="148" y="1338" class="small">Llamada / solicitud de datos</text>
<line x1="435" y1="1333" x2="495" y2="1333" class="result"/><text x="508" y="1338" class="small">Resultado / metadatos</text>
<line x1="790" y1="1333" x2="850" y2="1333" class="dep"/><text x="863" y="1338" class="small">Dependencia / implementa interfaz</text>
<text x="1300" y="1338" class="small">Trazabilidad: main.dart · DiscoverProvider · VideoPostRepositoryImpl · VideoPostDataSource</text>
</svg>

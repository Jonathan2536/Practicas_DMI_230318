<text x="70" y="168" class="layer">PRESENTACIÓN</text>
<text x="510" y="168" class="layer">PROVIDER</text>
<text x="900" y="168" class="layer">CONTRATOS / ENTIDAD</text>
<text x="1295" y="168" class="layer">INFRAESTRUCTURA</text>
<text x="1785" y="168" class="layer">ORÍGENES / PLAYERS</text>

<!-- presentation -->
<rect x="75" y="220" width="350" height="178" rx="12" class="card"/>
<text x="98" y="257" class="h">DiscoverScreen</text>
<text x="98" y="285" class="body">Discover · For You · Favorites</text>
<text x="98" y="310" class="small">Tres vistas sobre las listas del mismo Provider.</text>
<text x="98" y="335" class="small">Reintento si no hay videos o falla una fuente.</text>
<text x="98" y="365" class="mono">context.watch / context.read</text>
<rect x="75" y="445" width="350" height="145" rx="12" class="card"/>
<text x="98" y="482" class="h">_VideoSection</text>
<text x="98" y="511" class="body">Recibe videos por sección</text>
<text x="98" y="538" class="small">For You: ordena la lista completa.</text>
<text x="98" y="561" class="small">Favorites: filtra por isFavorite.</text>
<rect x="75" y="640" width="350" height="145" rx="12" class="card"/>
<text x="98" y="677" class="h">VideoScrollableView</text>
<text x="98" y="706" class="body">PageView vertical · video activo</text>
<text x="98" y="733" class="small">Entrega el VideoPost activo al reproductor.</text>
<text x="98" y="758" class="mono">FullScreenPlayer(videoPost)</text>
<rect x="75" y="835" width="350" height="168" rx="12" class="card"/>
<text x="98" y="872" class="h">FullScreenPlayer</text>
<text x="98" y="901" class="small">YouTube → YouTubePlayer (IFrame)</text>
<text x="98" y="926" class="small">Vimeo → embed en WebView</text>
<text x="98" y="951" class="small">Directa → VideoPlayerController.networkUrl</text>
<text x="98" y="977" class="tiny">La reproducción ocurre después de recibir metadatos.</text>

<!-- provider -->
<rect x="520" y="315" width="290" height="350" rx="13" class="card"/>
<text x="545" y="355" class="h">DiscoverProvider</text>
<text x="545" y="381" class="tag" fill="#755ea3">ChangeNotifier</text>
<line x1="545" y1="399" x2="785" y2="399" stroke="#e6dfef"/>
<text x="545" y="430" class="body">loadNextPage()</text>
<text x="545" y="455" class="small">Solicita resultados al Repository.</text>
<text x="545" y="490" class="body">Entrega estado a la UI:</text>
<text x="545" y="516" class="small">videos · initialLoading</text>
<text x="545" y="539" class="small">loadError · sourceFailures</text>
<text x="545" y="578" class="small">forYouVideos · favoriteVideos</text>
<text x="545" y="616" class="small">notifyListeners() en los cambios.</text>
<text x="545" y="640" class="tiny">loadNextPage vuelve a cargar el conjunto completo.</text>

<!-- domain contract / entity -->
<rect x="905" y="245" width="305" height="134" rx="12" class="card"/>
<text x="928" y="282" class="h">VideoPostRepository</text>
<text x="928" y="309" class="mono">Future&lt;List&lt;VideoPost&gt;&gt;</text>
<text x="928" y="337" class="small">Contrato · getVideoPosts()</text>
<text x="928" y="359" class="tiny">Diagnostics: lastSourceFailures</text>
<rect x="905" y="440" width="305" height="135" rx="12" class="card"/>
<text x="928" y="477" class="h">VideoPostDataSource</text>
<text x="928" y="505" class="mono">getVideoPosts()</text>
<text x="928" y="532" class="small">Interfaz común de las 4 fuentes</text>
<text x="928" y="555" class="tiny">Todas devuelven List&lt;VideoPost&gt;</text>
<rect x="905" y="660" width="305" height="188" rx="12" class="card"/>
<text x="928" y="697" class="h">VideoPost</text>
<text x="928" y="725" class="small">Entidad común del feed</text>
<text x="928" y="752" class="mono">id · caption · videoUrl · source</text>
<text x="928" y="776" class="mono">providerId · thumbnailUrl · ...</text>
<text x="928" y="814" class="tiny">No hay DTO externo común adicional.</text>

<!-- datasources -->
<rect x="1300" y="210" width="400" height="165" rx="12" class="card"/>
<text x="1323" y="247" class="h">LocalVideoPostDataSource</text>
<text x="1323" y="274" class="tag" fill="#4f8066">REGISTRADO EN main.dart</text>
<text x="1323" y="306" class="small">videoPosts → LocalVideoModel.fromJson</text>
<text x="1323" y="330" class="small">→ toVideoPostEntity() → VideoPost</text>
<text x="1323" y="354" class="tiny">Datos Dart; videoUrl es URL remota de Drive.</text>
<rect x="1300" y="405" width="400" height="165" rx="12" class="card"/>
<text x="1323" y="442" class="h">YouTubeVideoDataSource</text>
<text x="1323" y="469" class="tag" fill="#4f8066">REGISTRADO EN main.dart</text>
<text x="1323" y="501" class="small">playlistItems.list · pageToken</text>
<text x="1323" y="525" class="small">Mapea title, description, channel, thumbnail</text>
<text x="1323" y="549" class="tiny">Crea VideoPost directamente; URL YouTube.</text>
<rect x="1300" y="600" width="400" height="165" rx="12" class="card"/>
<text x="1323" y="637" class="h">PixabayVideoDataSource</text>
<text x="1323" y="664" class="tag" fill="#4f8066">REGISTRADO EN main.dart</text>
<text x="1323" y="696" class="small">Búsqueda por término y páginas de resultados</text>
<text x="1323" y="720" class="small">Selecciona URL MP4 · caché en memoria 24 h</text>
<text x="1323" y="744" class="tiny">Crea VideoPost directamente.</text>
<rect x="1300" y="795" width="400" height="165" rx="12" class="card"/>
<text x="1323" y="832" class="h">VimeoVideoDataSource</text>
<text x="1323" y="859" class="tag" fill="#4f8066">REGISTRADO EN main.dart</text>
<text x="1323" y="891" class="small">URLs configuradas → endpoint público oEmbed</text>
<text x="1323" y="915" class="small">Metadatos mapeados directamente a VideoPost</text>
<text x="1323" y="939" class="tiny">Reproduce el URL Vimeo en WebView.</text>
<rect x="1300" y="980" width="400" height="62" rx="12" class="card"/>
<text x="1320" y="1007" class="h">VideoPostRepositoryImpl</text>
<text x="1320" y="1028" class="tiny">infraestructura · concurrente · intercala · deduplica · conserva éxitos</text>

<!-- external endpoints -->
<rect x="1790" y="210" width="335" height="165" rx="12" class="card"/>
<text x="1813" y="247" class="h">Datos de video</text>
<text x="1813" y="279" class="body">videoPosts (Dart)</text>
<text x="1813" y="307" class="small">8 registros incluidos en el código</text>
<text x="1813" y="335" class="body">Google Drive</text>
<text x="1813" y="359" class="tiny">drive.google.com/uc?export=download&amp;id=…</text>
<rect x="1790" y="405" width="335" height="165" rx="12" class="card"/>
<text x="1813" y="442" class="h">YouTube</text>
<text x="1813" y="473" class="body">YouTube Data API v3</text>
<text x="1813" y="501" class="small">Playlist metadata / paginación</text>
<text x="1813" y="529" class="body">YouTube IFrame player</text>
<text x="1813" y="553" class="tiny">Reproducción; acceso/embedding puede restringir.</text>
<rect x="1790" y="600" width="335" height="165" rx="12" class="card"/>
<text x="1813" y="637" class="h">Pixabay</text>
<text x="1813" y="669" class="body">Pixabay Videos API</text>
<text x="1813" y="697" class="small">Respuesta con variantes de video</text>
<text x="1813" y="725" class="body">URL HTTPS MP4</text>
<text x="1813" y="749" class="tiny">La URL se reproduce con VideoPlayer.</text>
<rect x="1790" y="795" width="335" height="165" rx="12" class="card"/>
<text x="1813" y="832" class="h">Vimeo</text>
<text x="1813" y="864" class="body">vimeo.com/api/oembed.json</text>
<text x="1813" y="892" class="small">Metadatos de la URL pública</text>
<text x="1813" y="920" class="body">Vimeo embed · WebView</text>
<text x="1813" y="944" class="tiny">Privacidad/embedding condiciona reproducción.</text>

